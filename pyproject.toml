[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gastonomo"
version = "0.1.0"
description = "Control de gastos personales por categorias - EIF509 Grupo G01"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    # httpx habla con Microsoft Graph y con la API de Gmail al vincular un buzon.
    "httpx>=0.27",
    # cifra los tokens de acceso a los buzones antes de guardarlos en la base.
    "cryptography>=42",
    # carga las variables de .env sin que cada integrante tenga que exportarlas.
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
