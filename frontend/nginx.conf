# Azure/Google exigen que un redirect URI empiece con "https" (o sea
# literalmente "http://localhost") -no aceptan una IP de LAN en HTTP
# plano. Por eso este nginx sirve HTTPS de verdad (certificado en
# /etc/nginx/certs, montado desde fuera de la imagen -ver docker-compose.yml)
# y además hace de proxy hacia el backend bajo el mismo origen: si el
# frontend es HTTPS y el backend quedara en HTTP aparte, el navegador
# bloquearía esas llamadas como "contenido mixto". Con todo bajo un solo
# origen tampoco hace falta CORS entre ellos.

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App.tsx enruta a mano por window.location.pathname (login, callbacks de
    # OAuth, /privacidad, /terminos): sin esto, entrar directo a cualquiera
    # de esas rutas daría un 404 de nginx en vez de dejar que React decida.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# Mismo sitio, certificado distinto: nginx elige este bloque por SNI solo
# cuando el cliente pide exactamente el nombre MagicDNS de Tailscale -emitido
# de verdad por Let's Encrypt via `tailscale cert` (no autofirmado), así que
# quien entre por acá no ve ninguna advertencia de "conexión no segura".
# Cualquier otra identidad (IP de LAN, IP de Tailscale, "debian" a secas)
# sigue cayendo en el bloque de arriba exactamente como antes -esto no
# reemplaza nada, solo agrega una entrada más.
#
# El certificado se genera en el propio servidor (`tailscale cert`, no acá):
# es la llave privada de ESE nodo de Tailscale, así que no viaja por el
# repositorio -certs/.gitignore ya excluye todo *.pem. Vence cada ~90 días
# (Let's Encrypt); hay que volver a correr `tailscale cert` antes de que
# expire y reiniciar el frontend para que lo tome.
server {
    listen 443 ssl;
    server_name debian.tailfc167d.ts.net;

    ssl_certificate     /etc/nginx/certs/tailscale-fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/tailscale-privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
