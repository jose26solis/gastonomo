# App.tsx enruta a mano por window.location.pathname (login, callbacks de
# OAuth, /privacidad, /terminos): sin esto, recargar o entrar directo a
# cualquiera de esas rutas -no solo "/"- daría un 404 de nginx en vez de
# dejar que React lea la URL y decida qué mostrar.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre (assets/index-XXXX.js) son
    # inmutables -un build nuevo genera un nombre nuevo- así que se pueden
    # cachear agresivo sin riesgo de servir una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
