# ============================================================================
#  Gastonomo
#
#      docker compose up -d
#
#  Levanta todo: PostgreSQL, MongoDB, el backend (FastAPI) y el frontend
#  (build de Vite servido por nginx). El backend crea su propio esquema al
#  arrancar (SQLAlchemy, no Flyway -ver README) y siembra las categorías
#  estándar y un usuario de demostración si la base está vacía.
#
#  Las migraciones SQL versionadas de la propuesta de dominio original
#  (db/postgres/migrations/, db/postgres/seeds/, db/mongo/init/) documentan
#  el modelo de datos -ver docs/modelo-de-datos.md- pero no corren acá: el
#  esquema real de la aplicación en ejecución es el que gestiona el propio
#  backend, y ya no conviven las dos cosas en la misma base.
#
#  Las credenciales tienen valores por defecto para que 'docker compose up
#  -d' funcione sin configurar nada. Para cambiarlas (o para producción),
#  copiá .env.ejemplo a .env y completá los valores reales -nunca se sube
#  al repositorio.
# ============================================================================

name: gastonomo

services:

  # --------------------------------------------------------------------------
  #  PostgreSQL · el núcleo transaccional
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: gastonomo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gastonomo}
      POSTGRES_USER: ${POSTGRES_USER:-gastonomo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gastonomo_local}
      # Los TIMESTAMPTZ se guardan en UTC; esto solo afecta cómo se muestran.
      TZ: America/Costa_Rica
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gastonomo} -d ${POSTGRES_DB:-gastonomo}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --------------------------------------------------------------------------
  #  MongoDB · el subdominio documental
  #
  #  Los scripts de db/mongo/init se ejecutan SOLO la primera vez, cuando el
  #  volumen está vacío. Para volver a correrlos hay que hacer
  #  'docker compose down -v'. Ver docs/modelo-de-datos.md.
  # --------------------------------------------------------------------------
  mongo:
    image: mongo:8
    container_name: gastonomo-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-gastonomo}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-gastonomo_local}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-gastonomo}
      TZ: America/Costa_Rica
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_datos:/data/db
      - ./db/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet
          -u ${MONGO_USER:-gastonomo}
          -p ${MONGO_PASSWORD:-gastonomo_local}
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # --------------------------------------------------------------------------
  #  Backend · FastAPI/uvicorn
  # --------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gastonomo-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    # .env trae las credenciales de OAuth, la clave de cifrado, etc. -pero
    # NO la cadena de conexión: esa apunta a los nombres de servicio de esta
    # misma red (postgres/mongo), no a "localhost" como sí corresponde
    # cuando el backend corre directo en el host (ver GASTONOMO_URL_BASE_DATOS
    # en .env.ejemplo). Por eso se pisa acá abajo, después de env_file.
    env_file:
      - .env
    environment:
      GASTONOMO_URL_BASE_DATOS: postgresql+psycopg://${POSTGRES_USER:-gastonomo}:${POSTGRES_PASSWORD:-gastonomo_local}@postgres:5432/${POSTGRES_DB:-gastonomo}
      GASTONOMO_MONGO_URL: mongodb://${MONGO_USER:-gastonomo}:${MONGO_PASSWORD:-gastonomo_local}@mongo:27017
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  # --------------------------------------------------------------------------
  #  Frontend · build de Vite servido por nginx
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Tiene que ser una URL que el navegador de quien use la app pueda
        # alcanzar de verdad -la IP/dominio real, nunca "backend" (ese
        # nombre solo existe adentro de esta red de docker compose).
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: gastonomo-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  postgres_datos:
  mongo_datos:
